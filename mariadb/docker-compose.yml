services:
  mariadb:
    container_name: mariadb
    image: mariadb:10.8
    restart: unless-stopped
    command: --innodb-buffer-pool-size=2G
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"

volumes:
  mariadb-data:
